<!doctype html>
<meta charset="utf-8">
<title>OpenCycle UI harness</title>
<style>body{margin:0;background:#050505;color:#8C96A5;font:12px sans-serif}canvas{margin:8px;image-rendering:pixelated}</style>
<body>
<script type="module">
// Screenshot harness for the Meridian UI. Serve the repo root (python3 -m http.server) and open
// /docs/ui/harness.html. docs/ui/shoot.mjs drives it with Playwright and writes the PNGs.
import { createDevice, SCREENS, SOFTKEYS, fontsReady, W, H } from '../../viewer/ui/screens_color.js';

// representative moment (seconds) for each screen
const SHOT_T = { ride: 2.0, hr: 1.3, climb: 9, map: 3.2, workout: 5, status: 1, lap: 1.6, summary: 3, menu: 0.9, boot: 4.6 };
const dev = createDevice();

function frame(id, t) {
  dev.render(id, t ?? SHOT_T[id] ?? 2);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  c.getContext('2d').drawImage(dev.canvas, 0, 0);
  return c;
}
function up(c, k) {
  const o = document.createElement('canvas'); o.width = c.width * k; o.height = c.height * k;
  const g = o.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(c, 0, 0, o.width, o.height); return o;
}
// contact sheet: each screen at 2x in a dark device bezel with the three front keys underneath
function overview(ids) {
  const k = 2, sw = W * k, sh = H * k, pad = 36, cols = 5;
  const dw = sw + 2 * pad, dh = sh + pad + 84;
  const rows = Math.ceil(ids.length / cols), gap = 40, m = 60, cap = 56;
  const o = document.createElement('canvas');
  o.width = m * 2 + cols * dw + (cols - 1) * gap; o.height = m * 2 + 90 + rows * (dh + cap) + (rows - 1) * gap;
  const g = o.getContext('2d');
  const bgr = g.createLinearGradient(0, 0, 0, o.height); bgr.addColorStop(0, '#15191e'); bgr.addColorStop(1, '#0a0c0f');
  g.fillStyle = bgr; g.fillRect(0, 0, o.width, o.height);
  g.fillStyle = '#EFF7F7'; g.font = '700 34px "Chakra Petch"'; g.letterSpacing = '6px'; g.fillText('OPENCYCLE · MERIDIAN', m, m + 30);
  g.fillStyle = '#8C96A5'; g.font = '600 18px "Chakra Petch"'; g.letterSpacing = '2px'; g.fillText('240 × 320 · RGB565 · LVGL 9 · SCREENS AT 2× (NEAREST NEIGHBOUR)', m, m + 60);
  g.letterSpacing = '0px';
  ids.forEach((id, i) => {
    const x = m + (i % cols) * (dw + gap), y = m + 90 + Math.floor(i / cols) * (dh + cap + gap);
    g.fillStyle = '#1b1f24'; g.beginPath(); g.roundRect(x, y, dw, dh, 34); g.fill();
    g.strokeStyle = '#2b3138'; g.lineWidth = 2; g.stroke();
    g.fillStyle = '#020303'; g.beginPath(); g.roundRect(x + pad - 10, y + pad - 10, sw + 20, sh + 20, 8); g.fill();
    g.imageSmoothingEnabled = false; g.drawImage(frame(id), x + pad, y + pad, sw, sh);
    for (let j = 0; j < 3; j++) { // the three unlabelled front keys, centred under each soft-key cell
      const cx = x + pad + (sw / 3) * (j + 0.5), ky = y + pad + sh + 30;
      g.fillStyle = '#2a3037'; g.beginPath(); g.roundRect(cx - 44, ky, 88, 26, 13); g.fill();
      g.fillStyle = '#353c44'; g.beginPath(); g.roundRect(cx - 41, ky + 2, 82, 11, 7); g.fill();
    }
    g.fillStyle = '#EFF7F7'; g.font = '700 20px "Chakra Petch"'; g.letterSpacing = '2px';
    g.fillText(id.toUpperCase(), x + 8, y + dh + 36); g.letterSpacing = '0px';
    g.fillStyle = '#8C96A5'; g.font = '600 16px "Chakra Petch"'; g.textAlign = 'right';
    g.fillText(SOFTKEYS[id].filter(Boolean).join('  ·  ') || '(no keys)', x + dw - 8, y + dh + 36); g.textAlign = 'left';
  });
  return o;
}
window.shots = async () => {
  await fontsReady();
  const out = {};
  for (const { id } of SCREENS) { const c = frame(id); out[`${id}.png`] = c.toDataURL('image/png'); out[`${id}@3x.png`] = up(c, 3).toDataURL('image/png'); }
  out['overview.png'] = overview(SCREENS.map((s) => s.id)).toDataURL('image/png');
  return out;
};
window.frameAt = async (id, t, k = 3) => { await fontsReady(); return up(frame(id, t), k).toDataURL('image/png'); };
await fontsReady();
for (const { id } of SCREENS) document.body.appendChild(up(frame(id), 2));
window.ready = true;
</script>
